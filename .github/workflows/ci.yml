name: CI

# REQ-004 FR-A4 / 4-A + FR-F1.4 / AC-5：lint → typecheck → test（含测试库集成 + 覆盖率门槛）→ build；红不过合
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SHIGUANGRI_TEST_DB: postgresql://postgres:postgres@localhost:5432/shiguangri_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint . --quiet   # 0 error（领域依赖规则已升 error）

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare test database
        run: npx tsx packages/db/runner.ts --fresh

      - name: Test with coverage gate (identity/finance/timeline/ai ≥ 60% lines)
        run: npm run test:coverage

      - name: Build
        run: npm run build
